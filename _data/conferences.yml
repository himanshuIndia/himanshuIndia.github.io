# Conference deadlines shown at /deadlines/
#
# DATE CONVENTION — read before editing:
# `deadline` / `abstract_deadline` hold the deadline's WALL-CLOCK time in the zone
# named by `timezone`, written with a trailing "Z" (the Z is only there so Safari
# parses it; it does NOT mean UTC). _layouts/conferences.html then does
#     deadlineUTC = parse(deadline) - offsetOf(timezone)
# so writing a already-converted UTC instant here would apply the offset twice and
# put the countdown 12 hours late.
# Almost every ML venue states deadlines as 23:59 Anywhere-on-Earth, so the normal
# entry is `"<date>T23:59:00Z"` with `timezone: "UTC-12"` — copy the date straight
# off the CFP without converting.
#
# Verified 2026-08-07 against the official pages linked in each entry.
# Sorted soonest first.

- name: WACV 2027 (Round 2)
  url: https://wacv.thecvf.com/Conferences/2027/Dates
  # Round-2 papers must first be enrolled in OpenReview; Round-1 papers must not re-enroll.
  abstract_deadline: "2026-08-21T23:59:00Z"
  deadline: "2026-08-28T23:59:00Z"
  date: 4-8 January 2027
  timezone: "UTC-12"
  venue: Lake Buena Vista, Florida, USA
  note: Abstract deadline is the mandatory OpenReview paper enrollment for Round 2.

- name: ICLR 2027
  url: https://iclr.cc/Conferences/2027/CallForPapers
  abstract_deadline: "2026-09-18T23:59:00Z"
  deadline: "2026-09-25T23:59:00Z"
  date: 26-30 April 2027
  timezone: "UTC-12"
  venue: California, USA
  note: Abstract registration is mandatory — no abstract by the first deadline means no paper upload.

- name: EACL 2027 (ARR commitment)
  url: https://2027.eacl.org/calls/papers/
  deadline: "2026-10-11T23:59:00Z"
  date: 9-14 March 2027
  timezone: "UTC-12"
  venue: Athens, Greece
  note: >-
    ARR-only venue. This is the commitment deadline, not a writing deadline — the paper
    must already be in ARR with reviews and a meta-review. The ARR submission cycle that
    feeds it closed on 3 Aug 2026.

- name: NAACL 2027 (ARR submission)
  url: https://2027.naacl.org/
  deadline: "2026-10-12T23:59:00Z"
  date: 1-5 June 2027
  timezone: "UTC-12"
  venue: San Francisco, California, USA
  note: >-
    ARR-only venue. This is the October ARR cycle — the last one committable to NAACL 2027.
    The separate commitment step follows on 20 Dec 2026.

