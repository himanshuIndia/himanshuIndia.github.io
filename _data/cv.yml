# RenderCV-format CV data.
#
# al-folio v1 renders /cv/ from `site.data.cv.cv` (RenderCV) or
# `site.data.resume` (JSONResume). The pre-v1 format — a top-level list of
# {title, type, contents} sections — is no longer read at all and renders
# "No CV data found", so this file was converted.
#
# Section keys below are matched by name in al_folio_cv's render template:
# Experience, Education, Awards, Publications, Skills, Languages, Certificates,
# Projects, Interests, References get purpose-built templates. Any other
# section name falls back to a generic renderer that understands `bullet`
# or `label`/`details` entries — that is how Patents and Academic Service work.
#
# Dates are quoted so YAML keeps them as strings. Omitting `end_date` renders
# as "Present".
#
# Source of truth: assets/pdf/himanshu_singh_cv.pdf

